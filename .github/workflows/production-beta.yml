name: Production beta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-beta-gate:
    name: Windows beta gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test release scripts
        run: npm run test:release-scripts

      - name: Run unified production-beta verification
        run: npm run verify:beta

      - name: Build production frontend
        run: npm run build:frontend

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit desktop dependencies
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Scan source release contents
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "forgex-source.zip"
          git archive --format=zip --output=$archive HEAD
          npm run scan:release -- $archive
